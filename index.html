
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#047857">
  <meta name="description" content="Controle financeiro pessoal">
  <title>Finanças Pessoais</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    main {
      max-width: 650px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
    }
    h1 { color: #047857; }
    .status {
      padding: 14px;
      background: #ecfdf5;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Finanças Pessoais</h1>
    <p>Seu controle financeiro pessoal.</p>
    <div class="status">
      <strong>Projeto iniciado!</strong>
      <p>Esta é a estrutura inicial do aplicativo.</p>
    </div>
  </main>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.error("Falha no modo offline:", error));
      });
    }
  </script>
</body>
</html>
